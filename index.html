<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mukesh Jha (Chain) | Developer Portal</title>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #00f2fe;
      --secondary: #4facfe;
      --accent: #ff007f;
      --bg: #030712;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(79, 172, 254, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(255, 0, 127, 0.15) 0px, transparent 50%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Ultra RGB Loader */
    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .spinner {
      width: 60px;
      height: 60px;
      border: 4px solid transparent;
      border-top: 4px solid #00f2fe;
      border-right: 4px solid #ff007f;
      border-bottom: 4px solid #4facfe;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.4);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 15px;
      letter-spacing: 3px;
      font-weight: 700;
      text-transform: uppercase;
      background: linear-gradient(90deg, #00f2fe, #ff007f, #00f2fe);
      background-size: 200% auto;
      color: transparent;
      -webkit-background-clip: text;
      animation: shine 2s linear infinite;
    }

    .hidden {
      display: none !important;
    }

    /* Animated RGB Card Outer Border */
    .card-wrapper {
      position: relative;
      max-width: 420px;
      width: 100%;
      border-radius: 26px;
      padding: 2px;
      background: linear-gradient(60deg, #ff007f, #00f2fe, #4facfe, #9b51e0, #ff007f);
      background-size: 300% 300%;
      animation: rgbBorder 6s ease alternate infinite;
      box-shadow: 0 10px 40px -10px rgba(0, 242, 254, 0.4);
    }

    @keyframes rgbBorder {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Glass Card Inner */
    .app-card {
      background: rgba(11, 15, 25, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      overflow: hidden;
      text-align: center;
      padding: 30px 22px 24px;
    }

    /* Profile Glow Image */
    .avatar-box {
      position: relative;
      width: 105px;
      height: 105px;
      margin: 0 auto 16px;
    }

    .profile-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      position: relative;
      z-index: 2;
      border: 2.5px solid #ffffff;
    }

    .avatar-glow {
      position: absolute;
      top: -4px;
      left: -4px;
      right: -4px;
      bottom: -4px;
      border-radius: 50%;
      background: linear-gradient(45deg, #00f2fe, #ff007f, #4facfe);
      z-index: 1;
      filter: blur(10px);
      animation: spin 4s linear infinite;
    }

    /* 🌈 Animated Name with Neon Rainbow Gradient */
    .animated-name {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(90deg, #00f2fe, #ff007f, #ffe600, #00f2fe);
      background-size: 250% auto;
      color: transparent;
      -webkit-background-clip: text;
      animation: shine 3s linear infinite;
      text-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
      margin-bottom: 4px;
    }

    @keyframes shine {
      to { background-position: 250% center; }
    }

    /* Glowing Badge Designation */
    .designation {
      font-size: 13px;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    /* Live Animated Bio Tag */
    .bio-tag {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.05);
      border: 1px dashed rgba(56, 189, 248, 0.5);
      color: #e2e8f0;
      padding: 5px 14px;
      border-radius: 50px;
      margin-bottom: 18px;
    }

    /* Hacker Terminal Status */
    .terminal-box {
      background: #000000;
      border: 1px solid rgba(0, 242, 254, 0.25);
      border-radius: 12px;
      padding: 12px 14px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      text-align: left;
      margin-bottom: 20px;
      box-shadow: inset 0 0 10px rgba(0, 242, 254, 0.1);
    }

    .terminal-header {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 6px;
    }

    .dot { width: 8px; height: 8px; border-radius: 50%; }
    .dot-red { background: #ef4444; }
    .dot-yellow { background: #f59e0b; }
    .dot-green { background: #10b981; box-shadow: 0 0 8px #10b981; }

    .terminal-title {
      font-size: 10px;
      color: #64748b;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-left: 4px;
    }

    .terminal-text {
      color: #38bdf8;
      line-height: 1.6;
    }

    .terminal-text span.status {
      color: #10b981;
      font-weight: bold;
    }

    /* Premium Glow Buttons */
    .links-list {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .tool-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 18px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      text-decoration: none;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .tool-btn .btn-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .tool-btn i.main-ico {
      font-size: 19px;
      width: 24px;
      text-align: center;
    }

    .tool-btn:hover {
      transform: translateY(-3px) scale(1.01);
      border-color: rgba(255, 255, 255, 0.4);
    }

    /* Custom Button Glow Themes on Hover */
    .btn-wa:hover {
      background: linear-gradient(90deg, #25d366, #128c7e);
      box-shadow: 0 8px 20px rgba(37, 211, 102, 0.4);
      color: #000;
    }

    .btn-gh:hover {
      background: linear-gradient(90deg, #ffffff, #cbd5e1);
      box-shadow: 0 8px 20px rgba(255, 255, 255, 0.3);
      color: #000;
    }

    .btn-ig:hover {
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      box-shadow: 0 8px 20px rgba(225, 48, 108, 0.4);
      color: #fff;
    }

    .btn-mail:hover {
      background: linear-gradient(90deg, #ea4335, #c5221f);
      box-shadow: 0 8px 20px rgba(234, 67, 53, 0.4);
      color: #fff;
    }

    .arrow-icon {
      font-size: 12px;
      opacity: 0.6;
      transition: transform 0.2s ease;
    }

    .tool-btn:hover .arrow-icon {
      transform: translateX(4px);
      opacity: 1;
    }

    /* Footer */
    .card-footer {
      margin-top: 18px;
      font-size: 11px;
      color: #64748b;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <!-- RGB Loading Screen -->
  <div id="loader" class="loader-container">
    <div class="spinner"></div>
    <div class="loading-text">Loading Profile...</div>
  </div>

  <!-- RGB Glowing Card Container -->
  <div id="main-content" class="card-wrapper hidden">
    <div class="app-card">
      
      <!-- Avatar with Rotating Glow -->
      <div class="avatar-box">
        <div class="avatar-glow"></div>
        <img src="profile.jpg" alt="Mukesh Jha" class="profile-img">
      </div>

      <!-- 🌈 Animated Rainbow Name -->
      <h1 class="animated-name">Mukesh Jha (Chain)</h1>
      <div class="designation">Software Developer</div>
      <div class="bio-tag">🔥 Eat • Sleep • Code • Repeat</div>

      <!-- Terminal System Status -->
      <div class="terminal-box">
        <div class="terminal-header">
          <div class="dot dot-red"></div>
          <div class="dot dot-yellow"></div>
          <div class="dot dot-green"></div>
          <span class="terminal-title">System Console</span>
        </div>
        <div class="terminal-text">
          > Host: <span>ChainIND / JTAG</span><br>
          > Core: <span>Active & Ready</span><br>
          > Status: <span class="status">● ONLINE</span>
        </div>
      </div>

      <!-- Neon Buttons -->
      <div class="links-list">
        <a href="https://wa.me/919534266778" target="_blank" class="tool-btn btn-wa">
          <div class="btn-left">
            <i class="fa-brands fa-whatsapp main-ico" style="color: #25d366;"></i>
            <span>Chat on WhatsApp</span>
          </div>
          <i class="fa-solid fa-chevron-right arrow-icon"></i>
        </a>

        <a href="https://github.com/IndianJTAGTeam2022" target="_blank" class="tool-btn btn-gh">
          <div class="btn-left">
            <i class="fa-brands fa-github main-ico" style="color: #ffffff;"></i>
            <span>GitHub Repositories</span>
          </div>
          <i class="fa-solid fa-chevron-right arrow-icon"></i>
        </a>

        <a href="https://www.instagram.com/mukeshjhajadeja?igsi=MTU4YXY1djcydnNlaA==" target="_blank" class="tool-btn btn-ig">
          <div class="btn-left">
            <i class="fa-brands fa-instagram main-ico" style="color: #ff007f;"></i>
            <span>Instagram Official</span>
          </div>
          <i class="fa-solid fa-chevron-right arrow-icon"></i>
        </a>

        <a href="mailto:indianjtagteam2018@gmail.com" class="tool-btn btn-mail">
          <div class="btn-left">
            <i class="fa-solid fa-envelope main-ico" style="color: #ea4335;"></i>
            <span>Direct Email Support</span>
          </div>
          <i class="fa-solid fa-chevron-right arrow-icon"></i>
        </a>
      </div>

      <!-- Footer -->
      <div class="card-footer">
        ⚡ Powered by Indian JTAG Team • 2026
      </div>

    </div>
  </div>

  <script>
    // Smooth Loader
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('loader').classList.add('hidden');
        document.getElementById('main-content').classList.remove('hidden');
      }, 1000);
    });
  </script>
</body>
</html>
